ext {
    // 26, not Capacitor's default 24, because the barcode scanner N18 needs
    // declares 26 and the manifest merger refuses to go lower. The escape hatch
    // (tools:overrideLibrary) forces the merge and, in the merger's own words,
    // may lead to runtime failures — a crash when a parent points the camera at
    // a screen is worse than not supporting Android 7, which reached its end of
    // security support years before this product existed.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
}