name: Release

# Pushing a version tag verifies and publishes the versioned server container.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, tests, and production dependency audit
        run: |
          npm run typecheck
          npm test
          npm audit --omit=dev --audit-level=high

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable container
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: OSL_VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository_owner }}/openskylight:${{ github.ref_name }}
